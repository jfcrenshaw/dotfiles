- defaults:
    link:
      force: true
      relink: true
    shell:
      stderr: true

- clean: ["~"]

- shell:
    - [git submodule update --init --recursive, Installing submodules]

- link:
    # Regular locations
    ~/.profile:
      if: '[[ $SHELL == *bash && -z "$NERSC_HOST" ]]'
      path: profile.sh
    ~/.zprofile:
      if: '[[ $SHELL == *zsh && -z "$NERSC_HOST" ]]'
      path: zsh/zprofile
    ~/.zshrc:
      if: '[[ -z "$NERSC_HOST" ]]'
      path: zsh/zshrc
    # On NERSC
    ~/.profile.ext:
      if: '[[ $SHELL == *bash && -n "$NERSC_HOST" ]]'
      path: profile.sh
    ~/.zprofile.ext:
      if: '[[ $SHELL == *zsh && -n "$NERSC_HOST" ]]'
      path: zsh/zprofile
    ~/.zshrc.ext:
      if: '[[ -n "$NERSC_HOST" ]]'
      path: zsh/zshrc
    # Only on my Mac
    ~/.ssh/config:
      if: "[[ $(uname -s) == Darwin ]]"
      path: ssh.config
    # Other misc stuff
    ~/.gitconfig: git.config
    ~/.netrc: netrc
    # Claude Code
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/skills:
      path: claude/skills
